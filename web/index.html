<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agentsflow</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 2rem; background: #fff; color: #171717; }
    main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
    section { border: 1px solid #ccc; border-radius: .5rem; padding: 1rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #171717; color: #eee; }
      section { border-color: #555; }
    }
  </style>
</head>
<body>
  <h1>agentsflow</h1>
  <main>
    <section><h2>Claude</h2></section>
    <section><h2>Codex</h2></section>
  </main>
</body>
</html>
