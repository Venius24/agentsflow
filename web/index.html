<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentsflow</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f4; --panel: #ffffff; --panel-2: #f0f0ed; --border: #dcdcd6;
    --text: #1c1c1a; --muted: #6b6b64; --claude: #c2570c; --codex: #0f766e; --orch: #5b4bc4;
    --ok: #15803d; --err: #b91c1c; --warn: #a16207;
    --add-bg: #e3f6e8; --add-fg: #14532d; --del-bg: #fde7e7; --del-fg: #7f1d1d; --hunk: #1d4ed8;
    --user-bg: #e8ecf3;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121211; --panel: #1b1b19; --panel-2: #242421; --border: #34342f;
      --text: #ecece6; --muted: #9a9a90; --claude: #f08a3c; --codex: #3cc4b4; --orch: #a594ff;
      --ok: #4ade80; --err: #f87171; --warn: #facc15;
      --add-bg: #12301c; --add-fg: #9be8b1; --del-bg: #3a1717; --del-fg: #f5b5b5; --hunk: #8ab4ff;
      --user-bg: #232a38;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  header .spacer { flex: 1; }
  header .meta { color: var(--muted); font-size: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50vw; }
  .export { display: flex; align-items: center; gap: 5px; font-size: 12px; flex: none; }
  .export button { font-size: 12px; padding: 3px 8px; }
  .export-error { color: var(--err); font-size: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--ok); }
  .dot.bad { background: var(--err); }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 12px 16px; overflow-x: auto; overflow-y: hidden; }
  .col {
    flex: 1 0 340px; min-width: 340px; min-height: 0; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .col.orch { flex-basis: 380px; min-width: 380px; }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); border-top: 3px solid var(--accent); }
  .col-head h2 { margin: 0; font-size: 14px; color: var(--accent); }
  .col-heading { flex: 1; min-width: 0; }
  .col-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .col-subtitle { font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
  .team-meta { min-width: 0; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .chip.working { color: var(--accent); border-color: var(--accent); }
  .chip.waiting { color: var(--warn); border-color: var(--warn); }
  .chip.off { opacity: .6; }
  .chip.bypass { color: var(--err); border-color: var(--err); font-weight: 700; }
  .guard-warning { color: var(--err); font-weight: 700; overflow-wrap: anywhere; }
  .log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--muted); margin: auto; text-align: center; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant { background: var(--panel-2); align-self: flex-start; }
  .msg.user { background: var(--user-bg); align-self: flex-end; }
  details.tool { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 13px; }
  details.tool > summary { cursor: pointer; padding: 5px 10px; color: var(--muted); list-style: none; display: flex; gap: 8px; align-items: baseline; }
  details.tool > summary::-webkit-details-marker { display: none; }
  details.tool > summary::before { content: "▸"; font-size: 11px; }
  details.tool[open] > summary::before { content: "▾"; }
  details.tool .name { color: var(--text); font-weight: 600; font-family: var(--mono); }
  details.tool .prev { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  details.tool .state { margin-left: auto; font-size: 11px; }
  details.tool.ok .state { color: var(--ok); }
  details.tool.error .state { color: var(--err); }
  details.tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--border); font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; }
  details.tool pre.res.err { color: var(--err); }
  details.diff > summary .name { color: var(--text); }
  .diffbody { margin: 0; padding: 0; border-top: 1px solid var(--border); font: 12px/1.45 var(--mono); max-height: 360px; overflow: auto; }
  .diffbody div { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diffbody .add { background: var(--add-bg); color: var(--add-fg); }
  .diffbody .del { background: var(--del-bg); color: var(--del-fg); }
  .diffbody .hunk { color: var(--hunk); }
  .perm { border: 1px solid var(--warn); border-radius: 8px; padding: 9px 11px; background: var(--panel); }
  .perm.done { border-color: var(--border); opacity: .85; }
  .perm .ph { font-weight: 600; margin-bottom: 4px; }
  .perm pre { margin: 0 0 8px; padding: 6px 8px; background: var(--panel-2); border-radius: 6px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; }
  .perm .btns { display: flex; gap: 8px; align-items: center; }
  .perm .verdict { font-size: 12px; font-weight: 600; }
  .perm .verdict.allow { color: var(--ok); }
  .perm .verdict.deny { color: var(--err); }
  button { font: inherit; border-radius: 7px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); padding: 4px 13px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.allow { background: var(--ok); color: #fff; border-color: transparent; }
  button.deny { background: transparent; color: var(--err); border-color: var(--err); }
  button.send { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  .divider { text-align: center; color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 8px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--border); }
  .errline { color: var(--err); border: 1px solid var(--err); border-radius: 8px; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  form.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); background: var(--panel); }
  form.composer textarea { flex: 1; resize: none; height: 52px; border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; background: var(--bg); color: var(--text); font: inherit; }
  form.composer textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .msg .from { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .orch-controls { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .orch-controls select, .orch-controls textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px; background: var(--bg); color: var(--text); font: inherit; }
  .orch-controls textarea { resize: vertical; min-height: 62px; }
  .orch-controls textarea:focus, .orch-controls select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .orch-controls .steps { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .orch-controls .row { display: flex; gap: 8px; }
  .wfline { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .wfline .ic { width: 1.2em; text-align: center; flex: none; }
  .wfline.ok .ic { color: var(--ok); }
  .wfline.bad { color: var(--err); }
  .wfline .t { white-space: nowrap; flex: none; }
  .wfline .det { color: var(--muted); overflow-wrap: anywhere; }
  .handoff { border: 1px solid var(--accent); border-radius: 8px; padding: 6px 10px; background: var(--panel); }
  .handoff .hh { display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 12px; flex-wrap: wrap; }
  .handoff .hh .a-claude { color: var(--claude); }
  .handoff .hh .a-codex { color: var(--codex); }
  .handoff .hh .step { margin-left: auto; font-weight: 400; color: var(--muted); font-family: var(--mono); }
  .handoff .ht { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; max-height: 7.5em; overflow: hidden; }
  .handoff.open .ht { max-height: none; }
  .handoff .more { background: none; border: none; padding: 0; color: var(--muted); font-size: 11px; cursor: pointer; text-decoration: underline; }
  [hidden] { display: none !important; }
  .orch-tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .orch-tabs button { background: transparent; border-color: transparent; }
  .orch-tabs button[aria-selected="true"] { color: var(--orch); border-color: var(--orch); }
  .mail-badge { margin-left: 5px; border-radius: 999px; padding: 0 6px; background: var(--orch); color: #fff; font-size: 11px; }
  .mail-thread { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
  .mail-thread > summary { cursor: pointer; padding: 8px 10px; overflow-wrap: anywhere; }
  .mail-thread .thread-title { font-weight: 600; }
  .mail-thread .thread-meta { display: block; color: var(--muted); font-size: 11px; }
  .mail-items { border-top: 1px solid var(--border); padding: 0 10px; }
  .mail-item { padding: 9px 0; overflow-wrap: anywhere; }
  .mail-item + .mail-item { border-top: 1px solid var(--border); }
  .mail-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; color: var(--muted); font-size: 11px; }
  .mail-route { color: var(--text); font-weight: 600; }
  .mail-unread { color: var(--orch); font-weight: 600; }
  .mail-subject { font-weight: 600; font-size: 12px; margin-top: 3px; }
  .mail-body { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 18em; overflow: hidden; }
  .mail-body.expanded { max-height: none; }
  .mail-more { background: none; border: none; padding: 0; color: var(--muted); font-size: 11px; text-decoration: underline; }
  .mailline { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .mail-form { display: flex; flex-direction: column; gap: 6px; padding: 9px 12px; border-top: 1px solid var(--border); }
  .mail-form h3 { margin: 0; font-size: 12px; }
  .mail-form select, .mail-form input, .mail-form textarea { width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; background: var(--bg); color: var(--text); font: inherit; }
  .mail-form textarea { resize: vertical; min-height: 52px; }
  .mail-form .mail-fields { display: flex; gap: 6px; }
  .mail-form .mail-fields select { flex: 0 1 120px; }
  .mail-form .mail-fields input { flex: 1; }
  .mail-form .mail-actions { display: flex; align-items: center; gap: 8px; }
  .mail-form .mail-error { color: var(--err); font-size: 12px; overflow-wrap: anywhere; }
  .mail-reply-button { margin: 8px 10px; font-size: 12px; }
  .mail-form.reply { background: var(--panel-2); border-radius: 0 0 8px 8px; }
  .views { display: flex; gap: 4px; }
  .views [aria-selected="true"] { border-color: var(--orch); color: var(--orch); }
  .dash-view, .board-view { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
  .dash-summary, .board-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .dash-card, .board-card, .board-column { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .dash-card h2, .board-column h2 { font-size: 14px; margin: 0 0 8px; }
  .dash-card dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; margin: 8px 0; }
  .dash-card dd { margin: 0; }
  .dash-muted, .board-meta { color: var(--muted); font-size: 12px; }
  .board-columns { display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; }
  .board-column { flex: 1 0 240px; min-width: 240px; background: var(--panel-2); }
  .board-card { margin-top: 8px; overflow-wrap: anywhere; }
  .board-card button, .board-card select { margin: 4px 4px 0 0; }
  .board-card textarea, .board-form textarea, .board-form input, .board-form select, .board-card select { max-width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px; font: inherit; }
  .board-card textarea { width: 100%; }
  .board-title { font-weight: 600; cursor: pointer; }
  .board-note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-error { color: var(--err); font-size: 12px; }
  progress { width: 100%; accent-color: var(--orch); }
  @media (max-width: 820px) {
    header .meta { max-width: 40vw; }
    .team-meta { display: none; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="conn-dot"></span>
  <h1>agentsflow</h1>
  <nav class="views" aria-label="Вид">
    <button type="button" data-view-button="chat">Чат</button>
    <button type="button" data-view-button="dash">Дашборд</button>
    <button type="button" data-view-button="board">Доска</button>
  </nav>
  <span id="conn-text" class="chip">подключение…</span>
  <div class="export"><span>Экспорт:</span><button type="button" id="export-md">Markdown</button><button type="button" id="export-jsonl">JSONL</button><span class="export-error" id="export-error" role="alert"></span></div>
  <span class="team-meta" id="team-summary"></span>
  <span class="spacer"></span>
  <span class="meta" id="cwd"></span>
</header>
<main id="panes" data-view="chat"></main>
<section class="dash-view" data-view="dash" hidden></section>
<section class="board-view" data-view="board" hidden></section>

<script>
"use strict";
const params = new URLSearchParams(location.search);
const TOKEN = params.get("token") || "";
let team = [];

const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function api(path) { return path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN); }
async function downloadExport(format) {
  const error = $("#export-error");
  error.textContent = "";
  try {
    const response = await fetch(api("/api/export?format=" + encodeURIComponent(format)));
    if (!response.ok) throw new Error("HTTP " + response.status);
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const disposition = response.headers.get("content-disposition") || "";
    const match = disposition.match(/filename="(agentsflow-[0-9]+\.(?:md|jsonl))"/);
    link.href = url;
    link.download = match ? match[1] : "agentsflow." + (format === "md" ? "md" : "jsonl");
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  } catch (err) { error.textContent = "Ошибка экспорта: " + err.message; }
}
$("#export-md").addEventListener("click", () => downloadExport("md"));
$("#export-jsonl").addEventListener("click", () => downloadExport("jsonl"));
async function post(path, body) {
  const r = await fetch(api(path), {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return data;
}

function preview(input, max = 90) {
  let s;
  if (input && typeof input === "object") {
    s = input.command ?? input.file_path ?? input.path ?? input.pattern ?? input.url;
    if (Array.isArray(input) && input.length && input[0].path) s = input.map(c => c.path).join(", ");
    if (typeof s !== "string") s = JSON.stringify(input);
  } else s = String(input ?? "");
  s = s.replace(/\s+/g, " ").trim();
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}
function fmtInput(v) {
  if (v && typeof v === "object" && typeof v.command === "string") {
    return "$ " + v.command + (typeof v.cwd === "string" ? "\n# cwd: " + v.cwd : "");
  }
  return pretty(v);
}
function pretty(v) {
  if (typeof v === "string") return v;
  try { return JSON.stringify(v, null, 2); } catch (_) { return String(v); }
}

const panes = Object.create(null);
function accentFor(member) {
  const base = member.kind === "claude" ? "var(--claude)" : member.kind === "codex" ? "var(--codex)" : "var(--muted)";
  const index = team.filter(a => a.kind === member.kind).findIndex(a => a.id === member.id);
  return index > 0 ? `color-mix(in srgb, ${base} ${Math.max(55, 100 - index * 15)}%, var(--text))` : base;
}
function updatePaneInfo(p, member) {
  p.a = member;
  p.col.style.setProperty("--accent", accentFor(member));
  p.name.textContent = member.id;
  p.lead.hidden = !member.lead;
  p.bypass.hidden = member.mode !== "bypass";
  p.guard.hidden = member.guard !== true || member.mode === "bypass";
  const mode = { ask: "спрашивает", auto: "авто", bypass: "BYPASS" }[member.mode];
  const sandbox = member.kind === "codex" ? (member.mode === "bypass" ? "без песочницы" : member.sandbox) : null;
  p.subtitle.textContent = [member.kind || "тип неизвестен", member.model || "по умолчанию", member.effort || "по умолчанию", mode, sandbox, member.title].filter(Boolean).join(" · ");
  p.input.placeholder = "Промпт для " + member.id + " (Enter — отправить, Shift+Enter — перенос)";
}
function ensurePane(id) {
  if (!panes[id]) buildPane({ id, kind: null, title: "", lead: false }, false);
  return panes[id];
}
function buildPane(a, enabled = true) {
  const col = el("section", "col");
  const head = el("div", "col-head");
  const heading = el("div", "col-heading");
  const title = el("div", "col-title");
  const name = el("h2");
  const lead = el("span", "chip", "лидер");
  const bypass = el("span", "chip bypass", "bypass");
  const guard = el("span", "chip", "guard");
  const subtitle = el("div", "col-subtitle");
  title.append(name, lead, bypass, guard);
  heading.append(title, subtitle);
  head.append(heading);
  const chip = el("span", "chip", "idle");
  const stop = el("button", "deny", "Стоп");
  stop.type = "button";
  head.append(chip, stop);
  const stopError = el("div", "export-error");
  stopError.setAttribute("role", "alert");
  const log = el("div", "log");
  const empty = el("div", "empty", "Событий пока нет. Отправьте промпт ниже.");
  log.append(empty);
  const form = el("form", "composer");
  const input = el("textarea");
  const btn = el("button", "send", "Отправить");
  btn.type = "submit";
  form.append(input, btn);
  col.append(head, stopError, log, form);
  $("#panes").insertBefore(col, orch.col || null);

  const p = { a, col, name, lead, bypass, guard, subtitle, chip, stop, stopError, stopping: false, log, empty, input, btn, busy: false, enabled, pending: new Set(),
              tools: new Map(), perms: new Map() };
  panes[a.id] = p;
  updatePaneInfo(p, a);
  watchSticky(p);

  stop.addEventListener("click", async () => {
    if (!p.enabled || !p.busy || p.stopping) return;
    stopError.textContent = "";
    p.stopping = true;
    refreshStatus(p);
    try {
      await post("/api/agent/interrupt", { agent: a.id });
    } catch (err) {
      stopError.textContent = "Не удалось остановить: " + err.message;
    } finally {
      p.stopping = false;
      refreshStatus(p);
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || p.busy || !p.enabled) return;
    btn.disabled = true;
    try {
      await post("/api/prompt", { agent: a.id, text });
      input.value = "";
    } catch (err) {
      addError(p, "Не удалось отправить: " + err.message);
    } finally { refreshStatus(p); }
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  refreshStatus(p);
}

function refreshStatus(p) {
  let label = "idle", cls = "chip";
  if (!p.enabled) { label = "отключён"; cls += " off"; }
  else if (p.pending.size) { label = "ждёт разрешения"; cls += " waiting"; }
  else if (p.busy) { label = "работает"; cls += " working"; }
  p.chip.className = cls; p.chip.textContent = label;
  p.btn.disabled = !p.enabled || p.busy;
  p.stop.disabled = !p.enabled || !p.busy || p.stopping;
  p.input.disabled = !p.enabled;
  p.btn.title = p.busy ? "Агент занят" : "";
}

function watchSticky(p) {
  p.sticky = true;
  p.log.addEventListener("scroll", () => {
    p.sticky = p.log.scrollTop + p.log.clientHeight >= p.log.scrollHeight - 40;

}
function push(p, node) {

}
function stickToBottom(p) {

function renderDiff(path, patch) {
  const d = el("details", "tool diff");
  d.open = true;
  const s = el("summary");
  s.append(el("span", "name", "diff"), el("span", "prev", path));
  const body = el("div", "diffbody");
  for (const line of String(patch).split("\n")) {
    let cls = "";
    if (line.startsWith("+") && !line.startsWith("+++")) cls = "add";
    else if (line.startsWith("-") && !line.startsWith("---")) cls = "del";
    else if (line.startsWith("@@")) cls = "hunk";
    body.append(el("div", cls, line === "" ? " " : line));
  }
  d.append(s, body);
  return d;
}

function handle(env) {
  recordViewEvent(env);
  if (env.event.type === "mail") { handleMail(env); return; }
  if (env.event.type === "mail_read") { handleMailRead(env.event); return; }
  if (env.agent === "orchestrator") { handleOrch(env.event); return; }
  const p = ensurePane(env.agent);
  const ev = env.event;
  switch (ev.type) {
    case "message": {
      if (ev.role === "user") { p.busy = true; }
      const m = el("div", "msg " + (ev.role === "user" ? "user" : "assistant"));
      if (ev.role === "user" && p.handoff && p.handoff.text === ev.text) {
        m.append(el("span", "from", "← " + p.handoff.from + " · " + p.handoff.step));
        p.handoff = null;
      }
      m.append(document.createTextNode(ev.text));
      push(p, m);
      break;
    }
    case "tool_call": {
      p.busy = true;
      const d = el("details", "tool");
      const s = el("summary");
      s.append(el("span", "name", ev.name), el("span", "prev", preview(ev.input)), el("span", "state", "…"));
      d.append(s, el("pre", "", fmtInput(ev.input)));
      p.tools.set(ev.id, d);
      push(p, d);
      break;
    }
    case "tool_result": {
      const d = p.tools.get(ev.id);
      const err = !!ev.is_error;
      if (d) {
        d.classList.add(err ? "error" : "ok");
        $(".state", d).textContent = err ? "ошибка" : "готово";
        if (ev.output) d.append(el("pre", "res" + (err ? " err" : ""), ev.output));
      } else {
        push(p, el("div", err ? "errline" : "msg assistant", ev.output || "(пусто)"));
      }
      break;
    }
    case "diff":
      push(p, renderDiff(ev.path, ev.patch));
      break;
    case "permission_request": {
      p.busy = true;
      p.pending.add(ev.id);
      const card = el("div", "perm");
      card.append(el("div", "ph", "Нужно разрешение: " + ev.tool));
      if (ev.guard) card.append(el("div", "guard-warning", "⚠ опасно (" + ev.guard.rule + "): " + ev.guard.reason));
      card.append(el("pre", "", fmtInput(ev.input)));
      const row = el("div", "btns");
      const allow = el("button", "allow", "Разрешить");
      const deny = el("button", "deny", "Отклонить");
      const verdict = el("span", "verdict");
      const send = async (ok) => {
        allow.disabled = deny.disabled = true;
        try { await post("/api/permission", { agent: env.agent, id: ev.id, allow: ok }); }
        catch (err) { allow.disabled = deny.disabled = false; addError(p, "Ответ не принят: " + err.message); }
      };
      allow.onclick = () => send(true);
      deny.onclick = () => send(false);
      row.append(allow, deny, verdict);
      card.append(row);
      p.perms.set(ev.id, { card, row, verdict });
      push(p, card);
      break;
    }
    case "permission_resolved": {
      p.pending.delete(ev.id);
      const r = p.perms.get(ev.id);
      if (r) {
        r.card.classList.add("done");
        r.row.querySelectorAll("button").forEach(b => b.remove());
        r.verdict.textContent = ev.blocked_by_guard ? "отклонено guard" : ev.allow ? "✓ разрешено" : "✕ отклонено";
        r.verdict.className = "verdict " + (ev.allow ? "allow" : "deny");
      }
      break;
    }
    case "done":
      p.busy = false; p.pending.clear();
      push(p, el("div", "divider", "готово · " + ev.reason));
      break;
    case "error":
      addError(p, ev.message);
      break;
    default:
      break;
  }
  refreshStatus(p);
}

let lastSeq = 0, es = null;
function setConn(state, text) {
  $("#conn-dot").className = "dot " + (state === "on" ? "on" : state === "bad" ? "bad" : "");
  $("#conn-text").textContent = text;
}
function connect() {
  if (!TOKEN) { setConn("bad", "нет токена"); return; }
  es = new EventSource(api("/api/events"));
  es.onopen = () => setConn("on", "подключено");
  es.onmessage = (e) => {
    let env;
    try { env = JSON.parse(e.data); } catch (_) { return; }
    if (typeof env.seq === "number") { if (env.seq <= lastSeq) return; lastSeq = env.seq; }
    handle(env);
  };
  es.onerror = () => {
    if (es.readyState === EventSource.CLOSED) setConn("bad", "отключено (проверьте токен)");

  };
}

      pane.enabled = !!(st && st.enabled);

    if (s.workflow) { orch.running = !!s.workflow.running; refreshOrch(); }
    mail.agentsKnown = true;
    updateRecipients(mail.compose, null);
    for (const thread of mail.threads.values()) updateRecipients(thread.reply, thread);
    return true;
  } catch (_) { return false; }
}

const taskCards = new Map();
const recentEvents = new Map();
const statuses = { backlog: "Backlog", todo: "К выполнению", in_progress: "В работе", review: "Ревью", done: "Готово", blocked: "Заблокировано", archived: "Архив" };
let activeView = "chat", statsTimer = null, statsData = null, tasksLoaded = false;
function taskSnapshot(task) {
  const previous = taskCards.get(task.id);
  if (!previous || task.updated_ms >= previous.updated_ms) taskCards.set(task.id, task);
}
function recordViewEvent(env) {
  if (env.event.type === "task") {
    taskSnapshot(env.event.task);
    if (activeView === "board") renderBoard();
    if (activeView === "dash") renderDash();
  }
  const recent = recentEvents.get(env.agent) || [];
  recent.push(env.event.type + (env.event.tool ? " · " + env.event.tool : ""));
  recentEvents.set(env.agent, recent.slice(-3));
}
async function loadTasks() {
  const response = await fetch(api("/api/tasks?include_archived=1"));
  if (!response.ok) throw new Error("HTTP " + response.status);
  const data = await response.json();
  for (const task of data.tasks) taskSnapshot(task);
  tasksLoaded = true;
  if (activeView === "board") renderBoard();
  if (activeView === "dash") renderDash();
}
function setView(view) {
  activeView = view;
  for (const node of document.querySelectorAll("[data-view]")) node.hidden = node.dataset.view !== view;
  for (const button of document.querySelectorAll("[data-view-button]")) button.setAttribute("aria-selected", String(button.dataset.viewButton === view));
  try { localStorage.setItem("agentsflow.view", view); } catch (_) {}
  if (statsTimer) clearInterval(statsTimer);
  statsTimer = null;
  if (view === "dash") { renderDash(); refreshStats(); statsTimer = setInterval(refreshStats, 3000); }
  if (view === "board") renderBoard();
}
for (const button of document.querySelectorAll("[data-view-button]")) button.onclick = () => setView(button.dataset.viewButton);
async function refreshStats() {
  try {
    const response = await fetch(api("/api/stats"));
    if (!response.ok) throw new Error("HTTP " + response.status);
    statsData = await response.json();
    if (activeView === "dash") renderDash();
  } catch (_) { if (activeView === "dash") $(".dash-connection").textContent = "нет связи"; }
}
function duration(ms) { const seconds = Math.floor(ms / 1000); return Math.floor(seconds / 60) + " мин " + (seconds % 60) + " с"; }
function progressBar(value) { const p = el("progress"); p.max = 100; p.value = value || 0; return p; }
function renderDash() {
  const root = $('[data-view="dash"]');
  const connection = el("div", "dash-connection dash-muted", statsData ? "" : "Загрузка…");
  const summary = el("div", "dash-summary");
  if (statsData) {
    for (const [status, label] of Object.entries(statuses)) summary.append(el("span", "chip", label + ": " + (statsData.tasks[status] || 0)));
    const t = statsData.totals;
    summary.append(el("span", "chip", `Workflow: ${t.workflows_total} / ${t.workflows_finished} успешно / ${t.workflows_failed} ошибок`), el("span", "chip", "Писем: " + t.mails_total));
  }
  const grid = el("div", "dash-grid");
  for (const member of team) {
    const card = el("article", "dash-card"); card.dataset.agent = member.id;
    const pane = panes[member.id], stats = statsData && statsData.agents[member.id] || {};
    card.append(el("h2", "", member.id), el("div", "dash-muted", [member.kind, member.model || "по умолчанию", member.effort || "по умолчанию", member.mode].join(" · ")));
    card.append(el("span", "chip", pane ? pane.chip.textContent : "idle"));
    const list = el("dl");
    for (const [label, value] of [["Ходы", stats.turns || 0], ["Ошибки", stats.turn_errors || 0], ["Остановки", stats.interrupted || 0], ["Время работы", duration(stats.busy_ms || 0)], ["Инструменты", stats.tool_calls || 0], ["Разрешения", stats.permission_requests || 0], ["Отказы guard", stats.guard_denied || 0], ["Писем отправлено / получено", (stats.mails_sent || 0) + " / " + (stats.mails_received || 0)], ["Последняя активность", stats.last_activity_ms ? duration(Math.max(0, Date.now() - stats.last_activity_ms)) + " назад" : "нет"]]) list.append(el("dt", "", label), el("dd", "", String(value)));
    card.append(list);
    const current = [...taskCards.values()].find(t => t.assignee === member.id && t.status === "in_progress");
    if (current) card.append(el("div", "", current.title + " · " + current.progress + "%"), progressBar(current.progress));
    for (const event of recentEvents.get(member.id) || []) card.append(el("div", "dash-muted", event));
    grid.append(card);
  }
  root.replaceChildren(connection, summary, grid);
}
async function patchTask(id, body) {
  const response = await fetch(api("/api/tasks/" + encodeURIComponent(id)), { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "HTTP " + response.status);
}
function agentSelect(selected) {
  const select = el("select");
  const empty = el("option", "", "Не назначен"); empty.value = ""; select.append(empty);
  for (const member of team) { const option = el("option", "", member.id); option.value = member.id; select.append(option); }
  select.value = selected || ""; return select;
}
function statusSelect(selected) {
  const select = el("select");
  for (const [id, label] of Object.entries(statuses)) { const option = el("option", "", label); option.value = id; select.append(option); }
  select.value = selected; return select;
}
function renderTask(task) {
  const card = el("article", "board-card"); card.dataset.taskId = task.id; card.draggable = true;
  card.ondragstart = e => e.dataTransfer.setData("text/plain", task.id);
  const title = el("button", "board-title", task.title); title.type = "button";
  const editor = el("form", "board-editor"); editor.hidden = true;
  const editTitle = el("input"); editTitle.value = task.title;
  const description = el("textarea"); description.value = task.description;
  const save = el("button", "", "Сохранить"); save.type = "submit";
  const cancel = el("button", "", "Отмена"); cancel.type = "button"; cancel.onclick = () => { editor.hidden = true; };
  const error = el("div", "board-error");
  editor.append(editTitle, description, save, cancel);
  title.onclick = () => { editor.hidden = false; };
  editor.onsubmit = async e => { e.preventDefault(); try { await patchTask(task.id, { title: editTitle.value, description: description.value }); editor.hidden = true; } catch (err) { error.textContent = err.message; } };
  const status = statusSelect(task.status), assignee = agentSelect(task.assignee);
  status.setAttribute("aria-label", "Статус"); assignee.setAttribute("aria-label", "Исполнитель");
  status.onchange = async () => { try { await patchTask(task.id, { status: status.value }); } catch (err) { error.textContent = err.message; status.value = task.status; } };
  assignee.onchange = async () => { try { await patchTask(task.id, { assignee: assignee.value || null }); } catch (err) { error.textContent = err.message; assignee.value = task.assignee || ""; } };
  card.append(title, editor, el("div", "board-meta", task.assignee || "Не назначен"), progressBar(task.progress), el("div", "board-meta", task.progress + "% · " + task.labels.join(", ")), el("div", "board-note", task.note), el("div", "board-meta", new Date(task.updated_ms).toLocaleString()), status, assignee);
  if (task.assignee && ["backlog", "todo", "blocked"].includes(task.status)) {
    const dispatch = el("button", "", "Запустить"); dispatch.type = "button";
    dispatch.onclick = async () => { dispatch.disabled = true; try { await post("/api/tasks/" + encodeURIComponent(task.id) + "/dispatch", {}); } catch (err) { error.textContent = err.message; } finally { dispatch.disabled = false; } };
    card.append(dispatch);
  }
  const archive = el("button", "", "В архив"); archive.type = "button";
  archive.onclick = async () => { try { await patchTask(task.id, { status: "archived" }); } catch (err) { error.textContent = err.message; } };
  card.append(archive, error); return card;
}
function renderBoard() {
  const root = $('[data-view="board"]');
  const form = el("form", "board-form");
  const title = el("input"); title.placeholder = "Новая задача"; title.required = true;
  const description = el("textarea"); description.placeholder = "Описание";
  const assignee = agentSelect(null), submit = el("button", "", "Создать"), error = el("span", "board-error"); submit.type = "submit";
  form.append(title, description, assignee, submit, error);
  form.onsubmit = async e => { e.preventDefault(); submit.disabled = true; try { await post("/api/tasks", { title: title.value, description: description.value, assignee: assignee.value || null }); title.value = ""; description.value = ""; } catch (err) { error.textContent = err.message; } finally { submit.disabled = false; } };
  const columns = el("div", "board-columns");
  for (const [id, label] of Object.entries(statuses)) {
    if (id === "archived") continue;
    const column = el("section", "board-column"); column.dataset.status = id; column.append(el("h2", "", label));
    const items = [...taskCards.values()].filter(t => t.status === id);
    if (!items.length) column.append(el("div", "board-meta", "пусто"));
    for (const item of items.slice(0, 200)) column.append(renderTask(item));
    if (items.length > 200) column.append(el("div", "board-meta", "ещё " + (items.length - 200)));
    column.ondragover = e => e.preventDefault();
    column.ondrop = async e => { e.preventDefault(); const taskId = e.dataTransfer.getData("text/plain"); if (taskCards.has(taskId)) try { await patchTask(taskId, { status: id }); } catch (err) { column.append(el("div", "board-error", err.message)); } };
    columns.append(column);
  }
  root.replaceChildren(form, columns);
}

buildOrch();
let savedView = "chat";
try { if (["chat", "dash", "board"].includes(localStorage.getItem("agentsflow.view"))) savedView = localStorage.getItem("agentsflow.view"); } catch (_) {}
setView(savedView);
loadWorkflows();
async function refreshState() {
  const ready = await loadState();
  if (ready && !tasksLoaded) try { await loadTasks(); } catch (_) {}
  if (ready && !es) connect();
  if (!ready && !es) setConn("bad", TOKEN ? "не удалось загрузить команду" : "нет токена");
  setTimeout(refreshState, 5000);
}
refreshState();
</script>
