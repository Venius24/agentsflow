<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentsflow</title>
<style>
  :root {
    color-scheme: light dark;
    --ground: #F4F2EA; --panel: #FBFAF6; --raised: #ECE9DE; --rule: #CFCBBB;
    --ink: #0B1F4B; --ink-2: #3C4C73; --ink-3: #5A6786;
    --alert: #C4001F; --ok: #0A7A4B; --warn: #8A5A00;
    --line-0: #D0021B; --line-1: #0057B8; --line-2: #B87400; --line-3: #00803F; --line-4: #6E3FD0; --line-5: #007C8C;
    --orch: var(--ink);
    --add-bg: #DFF3E7; --add-fg: #0A4F2F; --del-bg: #FBE3E6; --del-fg: #7A0013; --hunk: #0057B8;
    --user-bg: #E4E8F2;
    --focus: #0B1F4B;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --display: "Bahnschrift", "DIN Alternate", "Franklin Gothic Medium", "Arial Narrow", var(--sans);
    --sans: "Segoe UI Variable Text", "Segoe UI", "Frutiger", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0A1B42; --panel: #0E2250; --raised: #132B60; --rule: #2A4177;
      --ink: #F4F2EA; --ink-2: #B4C0DA; --ink-3: #8C9BBF;
      --alert: #FF6577; --ok: #34D399; --warn: #FFB000;
      --line-0: #FF4D5E; --line-1: #4C9BFF; --line-2: #FFB000; --line-3: #2BD17E; --line-4: #B38CFF; --line-5: #3FD0E0;
      --add-bg: #0F3A33; --add-fg: #9BEBC0; --del-bg: #4A1E33; --del-fg: #FFB9C2; --hunk: #8AB8FF;
      --user-bg: #17306A;
      --focus: #F4F2EA;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.5 var(--sans); font-variant-numeric: tabular-nums;
  }
  ::selection { background: var(--ink); color: var(--ground); }
  * { scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1, h2, h3 { font-weight: 650; }

  .shell { height: 100%; display: grid; grid-template-columns: 208px minmax(0, 1fr); }
  .rail { display: flex; flex-direction: column; gap: 18px; padding: 18px 14px; background: var(--panel); border-right: 1px solid var(--rule); min-height: 0; overflow-y: auto; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; padding: 0 6px; }
  .brand svg { flex: none; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); font-weight: 560; position: relative; }
  .nav button:hover:not(:disabled) { background: var(--raised); color: var(--ink); }
  .nav button[aria-selected="true"] { color: var(--ink); background: var(--raised); box-shadow: inset 0 -2px 0 var(--ink); }
  .nav svg { flex: none; }
  .nav .count { margin-left: auto; }
  .rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 12px; color: var(--ink-3); }
  .rail-foot .team-meta { white-space: normal; overflow: visible; color: var(--ink-3); }
  .rail-foot .meta { font-family: var(--mono); overflow-wrap: anywhere; }
  .conn { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-3); flex: none; }
  .dot.on { background: var(--ok); border-color: var(--ok); }
  .dot.bad { background: var(--alert); border-color: var(--alert); }
  .export { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .export button { font-size: 12px; padding: 3px 9px; }
  .export-error { color: var(--alert); font-size: 12px; }

  .stage { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 14px 16px; overflow-x: auto; overflow-y: hidden; }
  .overview, .dash-view, .board-view { flex: 1; min-height: 0; overflow: auto; padding: 18px 22px 28px; }

  button { font: inherit; border-radius: 6px; border: 1px solid var(--rule); background: var(--raised); color: var(--ink); padding: 5px 13px; cursor: pointer; transition: border-color .15s, background-color .15s; }
  button:hover:not(:disabled) { border-color: var(--ink-3); }
  button:disabled { opacity: .5; cursor: default; }
  button.allow, button.send, button.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); font-weight: 650; }
  button.deny { background: transparent; color: var(--alert); border-color: var(--alert); }
  button.deny.strong { background: var(--alert); color: var(--ground); }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--ground); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 9px; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: -1px; }
  ::placeholder { color: var(--ink-3); }

  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--raised); color: var(--ink-2); border: 1px solid var(--rule); white-space: nowrap; }
  .chip.working { color: var(--ink); border-color: var(--accent, var(--ink)); }
  .chip.waiting { color: var(--warn); border-color: var(--warn); }
  .chip.off { opacity: .6; }
  .chip.bypass { background: var(--alert); color: var(--ground); border-color: var(--alert); font-weight: 750; }
  .guard-warning { color: var(--alert); font-weight: 700; overflow-wrap: anywhere; }

  .col { flex: 1 1 280px; min-width: 280px; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .col.orch { flex-basis: 320px; min-width: 320px; }
  .col-head { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--rule); border-top: 4px solid var(--accent); }
  .col-head h2 { margin: 0; font-size: 15px; }
  .col-heading { flex: 1; min-width: 0; }
  .col-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .col-subtitle { font-size: 11px; color: var(--ink-3); overflow-wrap: anywhere; }
  .log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; overflow-anchor: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .empty { color: var(--ink-3); margin: auto; text-align: center; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.assistant { background: var(--raised); align-self: flex-start; }
  .msg.user { background: var(--user-bg); align-self: flex-end; }
  details.tool { border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); font-size: 13px; }
  details.tool > summary { cursor: pointer; padding: 5px 10px; color: var(--ink-2); list-style: none; display: flex; gap: 8px; align-items: baseline; }
  details.tool > summary::-webkit-details-marker { display: none; }
  details.tool > summary::before { content: ""; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(-45deg); flex: none; align-self: center; transition: transform .15s var(--ease); }
  details.tool[open] > summary::before { transform: rotate(45deg); }
  details.tool .name { color: var(--ink); font-weight: 600; font-family: var(--mono); }
  details.tool .prev { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  details.tool .state { margin-left: auto; font-size: 11px; }
  details.tool.ok .state { color: var(--ok); }
  details.tool.error .state { color: var(--alert); }
  details.tool pre { margin: 0; padding: 8px 10px; border-top: 1px solid var(--rule); font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 280px; overflow: auto; }
  details.tool pre.res.err { color: var(--alert); }
  .diffbody { margin: 0; padding: 0; border-top: 1px solid var(--rule); font: 12px/1.45 var(--mono); max-height: 360px; overflow: auto; }
  .diffbody div { padding: 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diffbody .add { background: var(--add-bg); color: var(--add-fg); }
  .diffbody .del { background: var(--del-bg); color: var(--del-fg); }
  .diffbody .hunk { color: var(--hunk); }
  .perm { border: 1px solid var(--warn); border-radius: 6px; padding: 9px 11px; background: var(--panel); }
  .perm.danger { border-color: var(--alert); border-width: 2px; }
  .perm.done { border-color: var(--rule); opacity: .85; }
  .perm .ph { font-weight: 650; margin-bottom: 4px; }
  .perm pre { margin: 0 0 8px; padding: 6px 8px; background: var(--raised); border-radius: 4px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow: auto; }
  .perm .btns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .perm .verdict { font-size: 12px; font-weight: 650; }
  .perm .verdict.allow { color: var(--ok); }
  .perm .verdict.deny { color: var(--alert); }
  .divider { text-align: center; color: var(--ink-3); font-size: 11px; display: flex; align-items: center; gap: 8px; }
  .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }
  .errline { color: var(--alert); border: 1px solid var(--alert); border-radius: 6px; padding: 6px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  form.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--rule); background: var(--panel); }
  form.composer textarea { flex: 1; resize: none; height: 52px; }
  form.composer textarea:focus-visible { outline: 2px solid var(--accent); }
  .msg .from { display: block; font-size: 11px; color: var(--ink-3); margin-bottom: 2px; }
  .orch-controls { padding: 10px 12px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
  .orch-controls select, .orch-controls textarea { width: 100%; }
  .orch-controls textarea { resize: vertical; min-height: 62px; }
  .orch-controls .steps { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }
  .orch-controls .row { display: flex; gap: 8px; }
  .wfline { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .wfline .ic { width: 1.2em; text-align: center; flex: none; }
  .wfline.ok .ic { color: var(--ok); }
  .wfline.bad { color: var(--alert); }
  .wfline .t { white-space: nowrap; flex: none; }
  .wfline .det { color: var(--ink-3); overflow-wrap: anywhere; }
  .handoff { border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px; background: var(--panel); }
  .handoff .hh { display: flex; gap: 6px; align-items: center; font-weight: 650; font-size: 12px; flex-wrap: wrap; }
  .handoff .hh .step { margin-left: auto; font-weight: 400; color: var(--ink-3); font-family: var(--mono); }
  .handoff .ht { margin-top: 4px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; max-height: 7.5em; overflow: hidden; }
  .handoff.open .ht { max-height: none; }
  .handoff .more, .mail-more { background: none; border: none; padding: 0; color: var(--ink-3); font-size: 11px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .orch-tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--rule); }
  .orch-tabs button { background: transparent; border-color: transparent; }
  .orch-tabs button[aria-selected="true"] { border-color: var(--ink); }
  .mail-badge, .count { border-radius: 999px; padding: 0 7px; background: var(--ink); color: var(--ground); font-size: 11px; font-weight: 700; margin-left: 5px; }
  .mail-thread { border: 1px solid var(--rule); border-radius: 6px; background: var(--panel); }
  .mail-thread > summary { cursor: pointer; padding: 8px 10px; overflow-wrap: anywhere; }
  .mail-thread .thread-title { font-weight: 650; }
  .mail-thread .thread-meta { display: block; color: var(--ink-3); font-size: 11px; }
  .mail-items { border-top: 1px solid var(--rule); padding: 0 10px; }
  .mail-item { padding: 9px 0; overflow-wrap: anywhere; }
  .mail-item + .mail-item { border-top: 1px solid var(--rule); }
  .mail-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; color: var(--ink-3); font-size: 11px; }
  .mail-route { color: var(--ink); font-weight: 650; }
  .mail-unread { color: var(--ink); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; }
  .mail-subject { font-weight: 650; font-size: 12px; margin-top: 3px; }
  .mail-body { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 18em; overflow: hidden; }
  .mail-body.expanded { max-height: none; }
  .mailline { color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
  .mail-form { display: flex; flex-direction: column; gap: 6px; padding: 9px 12px; border-top: 1px solid var(--rule); }
  .mail-form h3 { margin: 0; font-size: 12px; }
  .mail-form select, .mail-form input, .mail-form textarea { width: 100%; min-width: 0; }
  .mail-form textarea { resize: vertical; min-height: 52px; }
  .mail-form .mail-fields { display: flex; gap: 6px; }
  .mail-form .mail-fields select { flex: 0 1 120px; }
  .mail-form .mail-fields input { flex: 1; }
  .mail-form .mail-actions { display: flex; align-items: center; gap: 8px; }
  .mail-form .mail-error { color: var(--alert); font-size: 12px; overflow-wrap: anywhere; }
  .mail-reply-button { margin: 8px 10px; font-size: 12px; }
  .mail-form.reply { background: var(--raised); border-radius: 0 0 6px 6px; }

  .page-title { margin: 0 0 14px; font-size: 24px; letter-spacing: -.01em; font-family: var(--display); font-weight: 600; }
  .ov-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; align-items: start; }
  .ov-main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
  .section-title { margin: 0 0 8px; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; }
  .section-title.big { font-family: var(--display); font-size: 24px; color: var(--ink); font-weight: 600; margin-bottom: 12px; }
  .diagram { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 6px 4px; overflow: hidden; }
  .diagram svg { display: block; width: 100%; height: auto; }
  .diagram text { fill: var(--ink); font-family: var(--sans); font-size: 11px; }
  .diagram text.name { font-size: 17px; font-weight: 600; font-family: var(--display); }
  .diagram text.sub { fill: var(--ink-2); font-size: 11px; }
  .diagram text.st { fill: var(--ink-2); font-size: 10.5px; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
  .diagram .tag { fill: var(--alert); }
  .diagram text.tagtext { fill: var(--ground); font-size: 10px; font-weight: 750; }
  .diagram .row { cursor: pointer; transition: opacity .25s var(--ease); }
  .diagram.focused .row:not(.on) { opacity: .45; }
  .diagram .row:focus-visible { outline: none; }
  .diagram .row:focus-visible .hit { stroke: var(--focus); stroke-width: 2; }
  .diagram .hit { fill: transparent; stroke: transparent; }
  .diagram .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .9s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { .diagram .draw { animation: none; stroke-dashoffset: 0; } .diagram .row { transition: none; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); padding: 6px 10px 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .diagram .legend svg { width: 22px; height: 20px; flex: none; }
  .focus-panel { border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
  .focus-panel h3 { margin: 0; font-size: 15px; }
  .focus-panel .grow { flex: 1; min-width: 200px; }
  .focus-panel .muted, .dash-muted, .board-meta { color: var(--ink-3); font-size: 12px; }
  table.timetable { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .timetable th { text-align: left; font-size: 12px; color: var(--ink-3); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--ink); }
  .timetable td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .timetable tr:last-child td { border-bottom: 0; }
  .timetable .who { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; font-family: var(--display); }
  .linechip { width: 20px; height: 7px; border-radius: 4px; background: var(--c, var(--ink)); flex: none; display: inline-block; }
  .timetable progress { width: 120px; display: block; margin-top: 4px; }
  .statebadge { display: inline-flex; align-items: center; gap: 7px; font-weight: 650; }
  .statebadge svg { flex: none; }
  .waits { position: sticky; top: 0; display: flex; flex-direction: column; gap: 10px; }
  .wait-card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
  .wait-card.danger { border: 2px solid var(--alert); }
  .wait-card h3 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; }
  .wait-card p { margin: 0 0 8px; font-size: 12px; color: var(--ink-2); overflow-wrap: anywhere; }
  .wait-card pre { margin: 0 0 10px; padding: 7px 9px; background: var(--raised); border-radius: 4px; font: 12px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 130px; overflow: auto; }
  .wait-card .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .wait-empty { display: flex; align-items: center; gap: 10px; color: var(--ink-2); padding: 14px; border: 1px dashed var(--rule); border-radius: 8px; }
  .err { color: var(--alert); font-size: 12px; }
  .views-note { color: var(--ink-3); font-size: 12px; }

  .dash-summary, .board-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .dash-card, .board-card, .board-column { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; }
  .dash-card { border-top: 4px solid var(--c, var(--ink)); }
  .dash-card h2, .board-column h2 { font-size: 14px; margin: 0 0 8px; }
  .dash-card dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; margin: 8px 0; }
  .dash-card dd { margin: 0; }
  .board-columns { display: flex; align-items: flex-start; gap: 10px; overflow-x: auto; }
  .board-column { flex: 1 1 0; min-width: 190px; background: var(--raised); }
  .board-column h2 { display: flex; align-items: center; gap: 6px; }
  .board-more { margin-top: 6px; }
  .board-meta.who { display: flex; align-items: center; gap: 8px; }
  .dash-more summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
  .board-card { margin-top: 8px; overflow-wrap: anywhere; }
  .board-card button, .board-card select { margin: 4px 4px 0 0; }
  .board-card textarea, .board-form textarea, .board-form input, .board-form select, .board-card select { max-width: 100%; }
  .board-card textarea { width: 100%; }
  .board-title { font-weight: 650; cursor: pointer; text-align: left; border: 0; background: none; padding: 0; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
  .board-note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-error { color: var(--alert); font-size: 12px; }
  progress { height: 8px; accent-color: var(--ink); }
  .timetable progress, .board-card progress, .dash-card progress { width: 100%; }

  @media (max-width: 1180px) {
    .ov-grid { grid-template-columns: minmax(0, 1fr); }
    .waits { position: static; order: -1; }
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .rail { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 14px; border-right: 0; border-bottom: 1px solid var(--rule); overflow: visible; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .nav button { width: auto; }
    .rail-foot { margin: 0; flex-direction: row; flex-wrap: wrap; align-items: center; }
    .rail-foot .team-meta, .rail-foot .meta { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true"><path d="M2 20h8l6-8h8" stroke="var(--line-1)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 8h8l6 8h8" stroke="var(--line-0)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="13" cy="14" r="4.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="2.5"/></svg>
      <span>agentsflow</span>
    </div>
    <nav class="nav" aria-label="Разделы">
      <button type="button" data-view-button="overview"></button>
      <button type="button" data-view-button="chat"></button>
      <button type="button" id="nav-mail"></button>
      <button type="button" data-view-button="board"></button>
      <button type="button" data-view-button="dash"></button>
    </nav>
    <div class="rail-foot">
      <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">подключение…</span></div>
      <div class="export"><span>Экспорт:</span><button type="button" id="export-md">Markdown</button><button type="button" id="export-jsonl">JSONL</button><span class="export-error" id="export-error" role="alert"></span></div>
      <span class="team-meta" id="team-summary"></span>
      <span class="meta" id="cwd"></span>
      <span class="meta" id="app-version"></span>
    </div>
  </aside>
  <div class="stage">
    <section class="overview" data-view="overview" id="overview" hidden></section>
    <main id="panes" data-view="chat" hidden></main>
    <section class="dash-view" data-view="dash" hidden></section>
    <section class="board-view" data-view="board" hidden></section>
  </div>
</div>

<script>
"use strict";
const params = new URLSearchParams(location.search);
const TOKEN = params.get("token") || "";
let team = [];

const $ = (sel, root = document) => root.querySelector(sel);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function api(path) { return path + (path.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN); }
async function downloadExport(format) {
  const error = $("#export-error");
  error.textContent = "";
  try {
    const response = await fetch(api("/api/export?format=" + encodeURIComponent(format)));
    if (!response.ok) throw new Error("HTTP " + response.status);
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    const disposition = response.headers.get("content-disposition") || "";
    const match = disposition.match(/filename="(agentsflow-[0-9]+\.(?:md|jsonl))"/);
    link.href = url;
    link.download = match ? match[1] : "agentsflow." + (format === "md" ? "md" : "jsonl");
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  } catch (err) { error.textContent = "Ошибка экспорта: " + err.message; }
}
$("#export-md").addEventListener("click", () => downloadExport("md"));
$("#export-jsonl").addEventListener("click", () => downloadExport("jsonl"));
async function post(path, body) {
  const r = await fetch(api(path), {
    method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body),
  });
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((data && data.error) || ("HTTP " + r.status));
  return data;
}

function preview(input, max = 90) {
  let s;
  if (input && typeof input === "object") {
    s = input.command ?? input.file_path ?? input.path ?? input.pattern ?? input.url;
    if (Array.isArray(input) && input.length && input[0].path) s = input.map(c => c.path).join(", ");
    if (typeof s !== "string") s = JSON.stringify(input);
  } else s = String(input ?? "");
  s = s.replace(/\s+/g, " ").trim();
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}
function fmtInput(v) {
  if (v && typeof v === "object" && typeof v.command === "string") {
    return "$ " + v.command + (typeof v.cwd === "string" ? "\n# cwd: " + v.cwd : "");
  }
  return pretty(v);
}
function pretty(v) {
  if (typeof v === "string") return v;
  try { return JSON.stringify(v, null, 2); } catch (_) { return String(v); }
}

const panes = Object.create(null);
function lineColor(id) {
  const index = team.findIndex(a => a.id === id);
  return index < 0 ? "var(--ink-3)" : "var(--line-" + (index % 6) + ")";
}
function accentFor(member) { return lineColor(member.id); }

const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}
const ICONS = {
  overview: ["M3 7h7l4 4h7", "M3 17h5l3-3h10", "circle"],
  chat: ["M4 5h16v11H9l-5 4z"],
  mail: ["M3 6h18v12H3z", "M3 7l9 7 9-7"],
  board: ["M4 4h5v16H4z", "M10 4h5v10h-5z", "M16 4h4v13h-4z"],
  dash: ["M4 20V10", "M10 20V4", "M16 20v-7", "M2 20h20"],
  check: ["M5 12l5 5 9-10"],
};
function icon(name, size = 18) {
  const s = svg("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": "1.75", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
  for (const d of ICONS[name]) s.append(d === "circle" ? svg("circle", { cx: 12, cy: 12, r: 2.5 }) : svg("path", { d }));
  return s;
}
function updatePaneInfo(p, member) {
  p.a = member;
  p.col.style.setProperty("--accent", accentFor(member));
  p.name.textContent = member.id;
  p.lead.hidden = !member.lead;
  p.bypass.hidden = member.mode !== "bypass";
  p.guard.hidden = member.guard !== true || member.mode === "bypass";
  const mode = { ask: "спрашивает", auto: "авто", bypass: "BYPASS" }[member.mode];
  const sandbox = member.kind === "codex" ? (member.mode === "bypass" ? "без песочницы" : member.sandbox) : null;
  p.subtitle.textContent = [member.kind || "тип неизвестен", member.model || "по умолчанию", member.effort || "по умолчанию", mode, sandbox, member.title].filter(Boolean).join(" · ");
  p.input.placeholder = "Задание для " + member.id;
  p.input.title = "Enter — отправить, Shift+Enter — перенос строки";
}
function ensurePane(id) {
  if (!panes[id]) buildPane({ id, kind: null, title: "", lead: false }, false);
  return panes[id];
}
function buildPane(a, enabled = true) {
  const col = el("section", "col");
  const head = el("div", "col-head");
  const heading = el("div", "col-heading");
  const title = el("div", "col-title");
  const name = el("h2");
  const lead = el("span", "chip", "лидер");
  const bypass = el("span", "chip bypass", "bypass");
  const guard = el("span", "chip", "guard");
  const subtitle = el("div", "col-subtitle");
  title.append(name, lead, bypass, guard);
  heading.append(title, subtitle);
  head.append(heading);
  const chip = el("span", "chip", "свободен");
  const stop = el("button", "deny", "Стоп");
  stop.type = "button";
  head.append(chip, stop);
  const stopError = el("div", "export-error");
  stopError.setAttribute("role", "alert");
  const log = el("div", "log");
  const empty = el("div", "empty", "Событий пока нет. Отправьте промпт ниже.");
  log.append(empty);
  const form = el("form", "composer");
  const input = el("textarea");
  const btn = el("button", "send", "Отправить");
  btn.type = "submit";
  form.append(input, btn);
  col.append(head, stopError, log, form);
  $("#panes").insertBefore(col, orch.col || null);

  const p = { a, col, name, lead, bypass, guard, subtitle, chip, stop, stopError, stopping: false, log, empty, input, btn, busy: false, enabled, pending: new Set(),
              tools: new Map(), perms: new Map() };
  panes[a.id] = p;
  updatePaneInfo(p, a);
  watchSticky(p);

  stop.addEventListener("click", async () => {
    if (!p.enabled || !p.busy || p.stopping) return;
    stopError.textContent = "";
    p.stopping = true;
    refreshStatus(p);
    try {
      await post("/api/agent/interrupt", { agent: a.id });
    } catch (err) {
      stopError.textContent = "Не удалось остановить: " + err.message;
    } finally {
      p.stopping = false;
      refreshStatus(p);
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || p.busy || !p.enabled) return;
    btn.disabled = true;
    try {
      await post("/api/prompt", { agent: a.id, text });
      input.value = "";
    } catch (err) {
      addError(p, "Не удалось отправить: " + err.message);
    } finally { refreshStatus(p); }
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  refreshStatus(p);
}

function refreshStatus(p) {
  let label = "свободен", cls = "chip";
  if (!p.enabled) { label = "отключён"; cls += " off"; }
  else if (p.pending.size) { label = "ждёт вас"; cls += " waiting"; }
  else if (p.busy) { label = "работает"; cls += " working"; }
  p.chip.className = cls; p.chip.textContent = label;
  p.btn.disabled = !p.enabled || p.busy;
  p.stop.disabled = !p.enabled || !p.busy || p.stopping;
  p.input.disabled = !p.enabled;
  p.btn.title = p.busy ? "Агент занят" : "";
  scheduleOverview();
}

function watchSticky(p) {
  p.sticky = true;
  p.log.addEventListener("scroll", () => {
    p.sticky = p.log.scrollTop + p.log.clientHeight >= p.log.scrollHeight - 40;
  });
}
function push(p, node) {
  if (p.empty && p.empty.isConnected) p.empty.remove();
  p.log.append(node);
  stickToBottom(p);
}
function stickToBottom(p) {
  if (p.sticky === false) return;
  const down = () => { if (p.sticky !== false) p.log.scrollTop = p.log.scrollHeight; };
  down();
  requestAnimationFrame(down);
}
function addError(p, text) { push(p, el("div", "errline", text)); }

function renderDiff(path, patch) {
  const d = el("details", "tool diff");
  d.open = true;
  const s = el("summary");
  s.append(el("span", "name", "diff"), el("span", "prev", path));
  const body = el("div", "diffbody");
  for (const line of String(patch).split("\n")) {
    let cls = "";
    if (line.startsWith("+") && !line.startsWith("+++")) cls = "add";
    else if (line.startsWith("-") && !line.startsWith("---")) cls = "del";
    else if (line.startsWith("@@")) cls = "hunk";
    body.append(el("div", cls, line === "" ? " " : line));
  }
  d.append(s, body);
  return d;
}

const waits = { perms: new Map() };
const armedPerms = new Set();
const permErrors = new Map();
// Кнопки ответа на запрос разрешения: общие для чата и обзора. Для опасной команды разрешение двухшаговое.
function permButtons(agent, ev, fail) {
  const row = el("div", "btns");
  const danger = !!ev.guard;
  const allow = el("button", danger ? "" : "allow", danger ? "Разрешить всё равно…" : "Разрешить");
  const deny = el("button", danger ? "deny strong" : "deny", "Отклонить");
  allow.type = deny.type = "button";
  const key = agent + "\u0000" + ev.id;
  const arm = () => { allow.textContent = "Да, разрешить опасную команду"; deny.textContent = "Нет, отклонить"; };
  if (danger && armedPerms.has(key)) arm();
  const send = async (ok) => {
    allow.disabled = deny.disabled = true;
    try { await post("/api/permission", { agent, id: ev.id, allow: ok }); }
    catch (err) { allow.disabled = deny.disabled = false; permErrors.set(key, "Ответ не принят: " + err.message); fail("Ответ не принят: " + err.message); }
  };
  allow.onclick = () => {
    if (danger && !armedPerms.has(key)) { armedPerms.add(key); arm(); return; }
    send(true);
  };
  deny.onclick = () => send(false);
  if (danger) row.append(deny, allow); else row.append(allow, deny);
  return { row, allow, deny };
}

function handle(env) {
  recordViewEvent(env);
  if (env.event.type === "mail") { handleMail(env); return; }
  if (env.event.type === "mail_read") { handleMailRead(env.event); return; }
  if (env.agent === "orchestrator") { handleOrch(env.event); return; }
  const p = ensurePane(env.agent);
  const ev = env.event;
  switch (ev.type) {
    case "message": {
      if (ev.role === "user") { p.busy = true; }
      const m = el("div", "msg " + (ev.role === "user" ? "user" : "assistant"));
      if (ev.role === "user" && p.handoff && p.handoff.text === ev.text) {
        m.append(el("span", "from", "← " + p.handoff.from + " · " + p.handoff.step));
        p.handoff = null;
      }
      m.append(document.createTextNode(ev.text));
      push(p, m);
      break;
    }
    case "tool_call": {
      p.busy = true;
      const d = el("details", "tool");
      const s = el("summary");
      s.append(el("span", "name", ev.name), el("span", "prev", preview(ev.input)), el("span", "state", "…"));
      d.append(s, el("pre", "", fmtInput(ev.input)));
      p.tools.set(ev.id, d);
      push(p, d);
      break;
    }
    case "tool_result": {
      const d = p.tools.get(ev.id);
      const err = !!ev.is_error;
      if (d) {
        d.classList.add(err ? "error" : "ok");
        $(".state", d).textContent = err ? "ошибка" : "готово";
        if (ev.output) d.append(el("pre", "res" + (err ? " err" : ""), ev.output));
      } else {
        push(p, el("div", err ? "errline" : "msg assistant", ev.output || "(пусто)"));
      }
      break;
    }
    case "diff":
      push(p, renderDiff(ev.path, ev.patch));
      break;
    case "permission_request": {
      p.busy = true;
      p.pending.add(ev.id);
      waits.perms.set(env.agent + "\u0000" + ev.id, { agent: env.agent, id: ev.id, tool: ev.tool, input: ev.input, guard: ev.guard || null });
      const card = el("div", "perm" + (ev.guard ? " danger" : ""));
      card.append(el("div", "ph", (ev.guard ? "Опасная команда: " : "Нужно разрешение: ") + ev.tool));
      if (ev.guard) card.append(el("div", "guard-warning", "Правило " + ev.guard.rule + ": " + ev.guard.reason));
      card.append(el("pre", "", fmtInput(ev.input)));
      const verdict = el("span", "verdict");
      const { row } = permButtons(env.agent, ev, (msg) => addError(p, msg));
      row.append(verdict);
      card.append(row);
      p.perms.set(ev.id, { card, row, verdict });
      push(p, card);
      break;
    }
    case "permission_resolved": {
      p.pending.delete(ev.id);
      waits.perms.delete(env.agent + "\u0000" + ev.id);
      armedPerms.delete(env.agent + "\u0000" + ev.id);
      permErrors.delete(env.agent + "\u0000" + ev.id);
      const r = p.perms.get(ev.id);
      if (r) {
        r.card.classList.add("done");
        r.row.querySelectorAll("button").forEach(b => b.remove());
        r.verdict.textContent = ev.blocked_by_guard ? "отклонено guard" : ev.allow ? "✓ разрешено" : "✕ отклонено";
        r.verdict.className = "verdict " + (ev.allow ? "allow" : "deny");
      }
      break;
    }
    case "done":
      p.busy = false; p.pending.clear();
      for (const key of [...waits.perms.keys()]) if (key.startsWith(env.agent + "\u0000")) waits.perms.delete(key);
      push(p, el("div", "divider", "готово · " + ev.reason));
      break;
    case "error":
      addError(p, ev.message);
      break;
    default:
      break;
  }
  refreshStatus(p);
}


const orch = { running: false, workflows: [] };
const mail = { threads: new Map(), messages: new Map(), read: new Set(), viewed: new Set(), awaiting: new Set(), agentsKnown: false };
function buildOrch() {
  const col = el("section", "col orch");
  orch.col = col;
  col.style.setProperty("--accent", "var(--orch)");
  const head = el("div", "col-head");
  head.append(el("h2", "", "Оркестратор"));
  orch.chip = el("span", "chip", "свободен");
  head.append(orch.chip);
  const tabs = el("div", "orch-tabs");
  tabs.setAttribute("role", "tablist");
  orch.journalTab = el("button", "", "Журнал");
  orch.mailTab = el("button", "", "Почта");
  orch.mailTab.title = "для вас: 0";
  orch.badge = el("span", "mail-badge", "0");
  orch.badge.hidden = true;
  orch.mailTab.append(orch.badge);
  for (const tab of [orch.journalTab, orch.mailTab]) {
    tab.type = "button";
    tab.setAttribute("role", "tab");
  }
  tabs.append(orch.journalTab, orch.mailTab);
  const ctl = el("div", "orch-controls");
  orch.controls = ctl;
  orch.select = el("select");
  orch.steps = el("div", "steps");
  orch.task = el("textarea");
  orch.task.placeholder = "Задача для workflow";
  const row = el("div", "row");
  orch.run = el("button", "send", "Запустить");
  orch.stop = el("button", "", "Стоп");
  orch.stop.disabled = true;
  row.append(orch.run, orch.stop);
  ctl.append(orch.select, orch.steps, orch.task, row);
  orch.log = el("div", "log");
  orch.empty = el("div", "empty", "Выберите workflow и задайте задачу: агенты будут передавать друг другу результаты.");
  orch.log.append(orch.empty);
  watchSticky(orch);
  mail.log = el("div", "log");
  mail.empty = el("div", "empty", "Писем пока нет");
  mail.log.append(mail.empty);
  watchSticky(mail);
  mail.compose = buildMailForm(null);
  col.append(head, tabs, ctl, orch.log, mail.log, mail.compose.form);
  $("#panes").append(col);

  orch.journalTab.onclick = () => selectOrchTab("journal");
  orch.mailTab.onclick = () => selectOrchTab("mail");
  let selected = "journal";
  try { if (localStorage.getItem("agentsflow.orchTab") === "mail") selected = "mail"; } catch (_) {}
  selectOrchTab(selected);

  orch.select.addEventListener("change", showSteps);
  orch.run.addEventListener("click", async () => {
    const task = orch.task.value.trim();
    if (!task || !orch.select.value) return;
    orch.run.disabled = true;
    try { await post("/api/workflow/run", { name: orch.select.value, task }); }
    catch (err) { addError(orch, "Не удалось запустить: " + err.message); }
    finally { refreshOrch(); }
  });
  orch.stop.addEventListener("click", async () => {
    try { await post("/api/workflow/stop", {}); }
    catch (err) { addError(orch, "Не удалось остановить: " + err.message); }
  });
  refreshOrch();
}
function selectOrchTab(tab) {
  const showMail = tab === "mail";
  orch.controls.hidden = showMail;
  orch.log.hidden = showMail;
  mail.log.hidden = !showMail;
  mail.compose.form.hidden = !showMail;
  orch.tab = tab;
  orch.journalTab.setAttribute("aria-selected", String(!showMail));
  orch.mailTab.setAttribute("aria-selected", String(showMail));
  try { localStorage.setItem("agentsflow.orchTab", tab); } catch (_) {}
  if (typeof syncNav === "function" && typeof navMail !== "undefined") syncNav();
  if (showMail) {
    for (const thread of mail.threads.values()) markThreadViewed(thread);
    stickToBottom(mail);
    requestAnimationFrame(refreshMailBodies);
  }
}
function agentName(agent) { return agent === "orchestrator" ? "вы (оркестратор)" : agent; }
function updateRecipients(form, thread) {
  const current = form.to.value;
  const allowed = team.filter(a => mail.agentsKnown && panes[a.id] && panes[a.id].enabled && (!thread || thread.participants.has(a.id)));
  form.to.replaceChildren(...allowed.map(a => {
    const option = el("option", "", a.id + (a.title ? " — " + a.title : ""));
    option.value = a.id;
    return option;
  }));
  if (allowed.some(a => a.id === current)) form.to.value = current;
  form.to.disabled = !mail.agentsKnown || !allowed.length || form.sending;
  form.send.disabled = form.to.disabled;
  if (!mail.agentsKnown) form.error.textContent = "Загрузка списка агентов…";
  else if (!allowed.length) form.error.textContent = "Нет доступных получателей";
  else if (form.error.textContent === "Нет доступных получателей" || form.error.textContent === "Загрузка списка агентов…") form.error.textContent = "";
}
function revealSentThread(id) {
  const thread = mail.threads.get(id);
  if (!thread) return;
  mail.awaiting.delete(id);
  thread.manual = true;
  thread.card.open = true;
  markThreadViewed(thread);
  thread.card.scrollIntoView({ block: "nearest" });
  requestAnimationFrame(refreshMailBodies);
}
function buildMailForm(thread) {
  const form = el("form", "mail-form" + (thread ? " reply" : ""));
  form.noValidate = true;
  if (!thread) form.append(el("h3", "", "Новое письмо"));
  const fields = el("div", "mail-fields");
  const to = el("select");
  to.setAttribute("aria-label", "Получатель");
  const subject = el("input");
  subject.type = "text";
  subject.placeholder = "Тема";
  subject.setAttribute("aria-label", "Тема");
  if (thread) subject.value = "Re: " + thread.subject;
  fields.append(to, subject);
  const body = el("textarea");
  body.placeholder = "Текст письма (Ctrl+Enter — отправить)";
  body.setAttribute("aria-label", "Текст письма");
  const actions = el("div", "mail-actions");
  const send = el("button", "send", "Отправить");
  send.type = "submit";
  const error = el("span", "mail-error");
  error.setAttribute("role", "alert");
  actions.append(send, error);
  form.append(fields, body, actions);
  const state = { form, to, subject, body, send, error, sending: false };
  updateRecipients(state, thread);
  body.addEventListener("keydown", event => {
    if (event.key === "Enter" && event.ctrlKey && !event.isComposing) {
      event.preventDefault();
      form.requestSubmit();
    }
  });
  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (state.sending) return;
    const title = subject.value.trim();
    const text = body.value;
    if (!mail.agentsKnown || !to.value || !panes[to.value] || !panes[to.value].enabled) {
      error.textContent = "Выберите доступного получателя";
      return;
    }
    if (!title || Array.from(title).length > 200) {
      error.textContent = "Тема обязательна и должна содержать не более 200 символов";
      return;
    }
    if (!text.trim() || new TextEncoder().encode(text).length > 65536) {
      error.textContent = "Текст обязателен и должен занимать не более 65536 байт UTF-8";
      return;
    }
    const payload = { from: "orchestrator", to: to.value, subject: title, body: text };

function stationMark(task, x, y, color) {

function buildDiagram(width) {

}
function sortedPerms() { return [...waits.perms.values()].sort((a, b) => (b.guard ? 1 : 0) - (a.guard ? 1 : 0)); }
