[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
claude-codes = { version = "2.1.314", default-features = false, features = ["async-client"] }
codex-codes = { version = "0.166.0", default-features = false, features = ["async-client"] }
axum = "0.8.9"
futures-util = "0.3.34"
tokio-stream = "0.1.19"
uuid = { version = "1.26.1", features = ["v4"] }
toml = "1.1.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
