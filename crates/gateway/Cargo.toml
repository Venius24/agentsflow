[package]
name = "agentsflow-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "agentsflow"
path = "src/main.rs"

[dependencies]
agentsflow-adapters = { path = "../adapters" }
agentsflow-events = { path = "../events" }
anyhow.workspace = true
axum.workspace = true
frankenstein.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal", "sync", "time", "net", "fs"] }
tokio-stream.workspace = true
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
toml.workspace = true
uuid.workspace = true

[lints]
workspace = true
