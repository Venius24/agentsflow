name = "cross-check"
description = "Независимые ответы и сравнение"

[[step]]
id = "claude_answer"
agent = "@reviewer"
prompt = "Ответь самостоятельно на задачу:\n{task}"

[[step]]
id = "codex_answer"
agent = "@engineer"
prompt = "Ответь самостоятельно на задачу:\n{task}"

[[step]]
id = "compare"
agent = "@lead"
prompt = "Сравни ответ участника {@reviewer} с ответом участника {@engineer}, найди расхождения и объясни их.\n\nОтвет {@reviewer}:\n{claude_answer.output}\n\nОтвет {@engineer}:\n{prev.output}"
