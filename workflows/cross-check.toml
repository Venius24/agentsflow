name = "cross-check"
description = "Независимые ответы и сравнение"

[[step]]
id = "claude_answer"
agent = "claude"
prompt = "Ответь самостоятельно на задачу:\n{task}"

[[step]]
id = "codex_answer"
agent = "codex"
prompt = "Ответь самостоятельно на задачу:\n{task}"

[[step]]
id = "compare"
agent = "claude"
prompt = "Сравни свой ответ с ответом Codex, найди расхождения и объясни их.\n\nТвой ответ:\n{claude_answer.output}\n\nОтвет Codex:\n{prev.output}"
