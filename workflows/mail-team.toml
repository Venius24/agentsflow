name = "mail-team"
description = "Команда делит работу, проверяет изменения и общается по почте"

[[step]]
id = "team"
agent = "@lead"
cc = ["@others"]
mode = "mail"
subject = "team task"
timeout_secs = 2700
until = "VERDICT: APPROVED"
next = "end"
prompt = '''Team task from the orchestrator. The team:
{team}

You work together in the same working directory; talk only with send_mail, always in this same thread, and do not wait for the user.

Task: {task}

Protocol:
1. Split. The lead ({@lead}) reads the relevant code and mails every other member a split: a list of files, each owned by exactly ONE member, and what each owner does. Give the junior (member with role junior, if any) small, well-bounded pieces (tests, docs, mechanical edits); the lead keeps the core and the integration. Nobody edits a file they do not own; if a change is needed in someone else's file, mail its owner. Every other member replies once to accept or object with a concrete alternative; the lead's next message is final. Non-lead members do not start before the split arrives.
2. Work. Each member implements their own files and, when done, mails the lead a short summary.
3. Review. The lead reviews every other member's files and mails each owner LGTM or concrete fixes; the owner fixes and mails again; at most 3 rounds. One non-lead engineer (the member with role engineer, if different from the lead) reviews the lead's files the same way. Everyone runs `cargo fmt --all -- --check`, `cargo clippy --offline --workspace --all-targets -- -D warnings` and `cargo test --offline --workspace` where the environment allows.
4. Finish. When all reviews are LGTM and checks pass, the lead mails the orchestrator in the same thread: who did what, which files, and check results. Its very last line must be `VERDICT: APPROVED`. If the team cannot finish, the lead mails the orchestrator why, without that line.

Environment: no network, cargo --offline, UTF-8 without BOM, no git commit or push.'''
